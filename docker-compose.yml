# Zar30 - Docker Compose for Development
# PostgreSQL 18.x + Redis 7 + MinIO (S3-compatible object storage)

services:
  postgres:
    image: postgres:18-alpine
    container_name: zar30-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: zar30
      POSTGRES_PASSWORD: zar30_dev_password
      POSTGRES_DB: zar30_dev
    volumes:
      # PostgreSQL 18+ نیازمند mount روی /var/lib/postgresql است (ساختار pg_ctlcluster)
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zar30 -d zar30_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: zar30-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    # minio/minio در Docker Hub archived است — از registry رسمی quay.io استفاده می کنیم
    # برای Development فعلاً latest — برای Production بعداً pin می شود
    image: quay.io/minio/minio:latest
    container_name: zar30-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: zar30
      MINIO_ROOT_PASSWORD: zar30_dev_password
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  minio_data:
