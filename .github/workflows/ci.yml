# ============================================
# Zar30 - CI Pipeline
# ============================================
# Install → Typecheck → Lint → Test → Build
# ============================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest

    # تست‌های integration به PostgreSQL و Redis واقعی نیاز دارند
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check || true

      - name: Generate Prisma Client
        run: pnpm db:generate
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/test"

      - name: Migrate + Seed test database
        run: pnpm exec prisma migrate deploy && pnpm db:seed
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/test"
          JWT_ACCESS_SECRET: "test_access_secret_min_32_chars_long!!"
          JWT_REFRESH_SECRET: "test_refresh_secret_min_32_chars_long!!"
          PASSWORD_PEPPER: "test_pepper"

      - name: Tests + Coverage
        run: pnpm exec vitest run --coverage
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/test"
          REDIS_URL: "redis://localhost:6379"
          JWT_ACCESS_SECRET: "test_access_secret_min_32_chars_long!!"
          JWT_REFRESH_SECRET: "test_refresh_secret_min_32_chars_long!!"
          PASSWORD_PEPPER: "test_pepper"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/test"
          REDIS_URL: "redis://localhost:6379"
          JWT_ACCESS_SECRET: "test_access_secret_min_32_chars_long!!"
          JWT_REFRESH_SECRET: "test_refresh_secret_min_32_chars_long!!"
          PASSWORD_PEPPER: "test_pepper"
