# ============================================
# Zar30 - Nginx Reverse Proxy (zar30.com)
# ============================================
# این فایل نمونه کانفیگ است — در aaPanel معمولاً از بخش
# Website → Settings → Config file یا Reverse Proxy اعمال می‌شود.
#
# جریان:
#   Internet → Nginx :443 (SSL) → Next.js روی 127.0.0.1:3000
#
# پورت 3000 فقط روی localhost بایند است — از اینترنت قابل دسترس نیست.
# ============================================

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name zar30.com www.zar30.com;
    return 301 https://zar30.com$request_uri;
}

# www → canonical redirect
server {
    listen 443 ssl;
    server_name www.zar30.com;

    # گواهی توسط aaPanel/Let's Encrypt صادر می‌شود
    # ssl_certificate     /path/to/www.zar30.com/fullchain.pem;
    # ssl_certificate_key /path/to/www.zar30.com/privkey.pem;

    return 301 https://zar30.com$request_uri;
}

# Canonical domain
server {
    listen 443 ssl;
    http2 on;
    server_name zar30.com;

    # ---- SSL (aaPanel Let's Encrypt این بلوک را مدیریت می‌کند) ----
    # ssl_certificate     /path/to/zar30.com/fullchain.pem;
    # ssl_certificate_key /path/to/zar30.com/privkey.pem;

    # ---- Security ----
    # اندازه body — آپلود مدارک KYC (بزرگ‌ترین payload سیستم)
    client_max_body_size 10m;

    # ---- Next.js (PM2 روی 127.0.0.1:3000) ----
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # headers لازم برای Next.js پشت proxy
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSocket upgrade — برای هر upgrade احتمالی (realtime/notifications)
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # timeout — Route handlerهای API ممکن است کند باشند (price sync، payment)
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    90s;

        # streaming/SSE — بافر غیرفعال برای پاسخ‌های زنده
        proxy_buffering off;
        proxy_cache off;

        # هدرهای ریدایرکت را دست‌نخورده عبور بده
        proxy_redirect off;
    }

    # Service Worker باید همیشه تازه سرو شود — بدون cache مرورگر اجباری
    location = /serwist/sw.js {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # لاگ‌ها — aaPanel مسیر پیش‌فرض خود را هم دارد
    # access_log /www/wwwlogs/zar30.com.log;
    # error_log  /www/wwwlogs/zar30.com.error.log;
}
